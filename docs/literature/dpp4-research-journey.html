글리플로진 | 피오글리타존·로시글리타존 |\n| GTEx 발현 예시 [T2] | 신장 피질 13.44 TPM; 소장 림프조직(Peyer's patch) 18.12 TPM | 신장 피질 32.05 TPM; 고환 15.04 TPM | 피하지방 61.80 TPM; 대망지방 57.17 TPM |\n| 약물의 규제 문서상 검토사항 [T1] | 시타글립틴: 췌장염 보고·신기능 관련 주의 | 엠파글리플로진: 케톤산증·체액 감소·비뇨생식기 감염 | 피오글리타존: 체액 저류·심부전 경고 |\n| 입문 실습 판단 [해석] | 우선 추천: 여러 약물과 결합 구조를 연결 가능 | 신장 운반체·막단백질의 구조 조건을 확인할 필요 | 유전학적 근거는 풍부하며 활성화 방식·안전성 해석 필요 |\n\n질환 ID와 전체 연관 후보 수는 [질환 식별 원문](../raw/2026-10-16-feasibility-opentargets-disease.json), [연관 타깃 원문](../raw/stage01/01-associated-targets.json)에 근거한다. 총 10,206개 중 점수 상위 100개만 조회했으며, 이 세 후보는 소분자 약물 연구의 실행 가능성을 고려한 비교 후보이다. 전체 타깃 순위의 상위 세 개를 고른 것이 아니다. 연관 점수는 치료 성공 확률이 아니다.\n\n유전학적 조회는 gwas_credible_sets·gene_burden·eva를 MONDO_0005148에 한정했다. DPP4와 SLC5A2의 0건은 해당 조회에서 근거를 확보하지 못했다는 뜻이며 유전학적 연관성의 부재를 확정하지 않는다. PPARG의 65행도 독립 논문 65편을 뜻하지 않는다. [DPP4 원문](../raw/stage02/DPP4-genetic-evidence.json), [SLC5A2 원문](../raw/stage02/SLC5A2-genetic-evidence.json), [PPARG 원문](../raw/stage02/PPARG-genetic-evidence.json).\n\n기존 약물 조회는 DPP4 21행, SLC5A2 17행, PPARG 40행을 반환했다. 염 형태·다른 적응증·개발 후보가 포함되므로 서로 다른 승인 당뇨병 약물 수로 해석하지 않는다. [DPP4 약물](../raw/stage02/DPP4-drugs.json), [SLC5A2 약물](../raw/stage02/SLC5A2-drugs.json), [PPARG 약물](../raw/stage02/PPARG-drugs.json).\n\n발현은 각각 1,474·1,460·1,409행을 전부 회수한 뒤 GTEx bulk RNA-seq의 TPM 중앙값만 비교했다. RNA 발현은 약물의 조직 선택성·효능·안전성을 증명하지 않는다. SLC5A2를 신장에만 발현한다고 해석하지 않는다. [DPP4 발현 전체 응답](../raw/stage02/DPP4-expression.full.json), [SLC5A2 발현 전체 응답](../raw/stage02/SLC5A2-expression.full.json), [PPARG 발현 전체 응답](../raw/stage02/PPARG-expression.full.json). MCP 응답이 길어 임시 파일로 제공된 원문은 프로젝트 raw에 복사하고 SHA-256 일치를 확인했다. 복사 메타데이터는 각 .provenance.json에 기록했다.\n\nOpenTargets 안전성 조회에서 DPP4와 SLC5A2는 safetyLiabilities 필드가 반환되지 않아 미확인이다. PPARG는 ToxCast·AOP-Wiki·ClinPGx·문헌 주석이 혼합되어 있으며, 수용체 결합 같은 시험 항목 자체를 임상 독성으로 판정하지 않았다. [DPP4 안전성](../raw/stage02/DPP4-safety.json), [SLC5A2 안전성](../raw/stage02/SLC5A2-safety.json), [PPARG 안전성](../raw/stage02/PPARG-safety.json).\n\n약물별 임상 주의사항은 [Januvia 라벨](https://www.accessdata.fda.gov/drugsatfda_docs/label/2024/021995Orig1s053lbl.pdf), [Jardiance 2025 라벨](https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/204629s063lbl.pdf), [Actos 2025 라벨](https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d2ddc491-88a9-4063-9150-443b4fa4330c)을 참고했다. Januvia PDF 본문 열기는 크기 제한으로 실패하여 이번에는 검색 응답의 규제 문서 발췌를 사용했다. 개별 약물의 경고를 해당 타깃의 모든 후보에 동일하게 적용하지 않는다. [라벨 검색 원문](../raw/stage02/label-search.json), [열기 원문과 부분 실패](../raw/stage02/label-views.json).\n\nDPP4 구조·교육 자료 근거: [앞선 질환 추천 보고서](2026-10-16-disease-recommendation.md), [1X70](https://www.rcsb.org/structure/1X70), [2RGU](https://www.rcsb.org/structure/2RGU). 해당 구조들은 참고 자료이며 아직 Boltz-2 입력을 확정하지 않았다.\n\n정리된 전체 후보 데이터: [target-comparison.json](../data/target-comparison.json).\n\nT1은 규제·임상 문서, T2는 실험 자료를 집계한 DB 근거로 구분했다. 발현·임상 이력·유전학적 연관성을 하나의 인과 주장으로 합치지 않는다. 최종 타깃 선택 후 3단계에서 출발 약물 최대 3개의 구조·기전·활성을 비교하고 개선 목표를 정한다.\n\n## ??? ??\n\n???? DPP4? ????. ?? ????? ?? ??? 3???? ??? ????.\n"},{"title":"출발 약물 비교","file":"03-starting-drug-comparison.md","text":"# DPP4 출발 약물 비교\n\n타깃 DPP4와 출발 약물 시타글립틴을 사용자가 선택했다. 개선 목표는 ‘결합 예측 유지 + 분자량 감소, ADMET 악화 여부 확인’이다. [사용자 선택 기록](../data/user-decisions-stage3.json). 아래 비교와 추천은 입문 연구 설계 의견이다.\n\n## 확인 결과\n\n사람 DPP4 단일 단백질은 ChEMBL CHEMBL284, UniProt P27487이다. 선택성 그룹 CHEMBL2111469와 구분했다. 세 약물은 모두 ChEMBL의 직접 작용 DPP4 억제 기전과 연결된다. 시타글립틴·알로글립틴의 기전은 염 형태 레코드에서 parent molecule로 연결되므로 기본 분자 ID만 조회하면 누락된다. 세 약물 모두 ChEMBL과 PubChem의 입체화학을 포함한 InChIKey가 일치했다. 모델에는 염·용매를 제외한 이 구조를 사용한다.\n\n| 후보 | ChEMBL ID | 계산 분자량 (g/mol) | 동일 실험 IC50 | 조회된 DPP4 활성 기록 수 |\n|---|---|---:|---:|---:|\n| 시타글립틴 | CHEMBL1422 | 407.32 | 18.0 nM | 104 |\n| 리나글립틴 | CHEMBL237500 | 472.55 | 1.0 nM | 43 |\n| 알로글립틴 | CHEMBL376359 | 339.40 | 4.0 nM | 47 |\n\n활성 비교는 CHEMBL2149434의 사람 혈장 DPP4, Gly-Pro-AMC 기질, 형광 측정 기록이다. 모두 관계기호 =, 단위 nM이며 ChEMBL data_validity_comment는 null이다. 원문 연결은 [PMID 22938786](https://pubmed.ncbi.nlm.nih.gov/22938786/)이고, 여기서는 ChEMBL이 수록한 실험 기록을 확인했다. 논문 전문의 모든 조건을 독립 재검증한 것은 아니다. 이 실험에서 낮은 IC50는 강한 억제를 뜻하지만 환자 효능·안전성의 우열은 뜻하지 않는다.\n\nChEMBL 37 검색에서 총 194개 활성 기록을 모두 받았다. 기록 수는 독립 실험이나 논문 수와 다르다. 다른 assay의 IC50·Ki·Kd·% inhibition은 합쳐 평균내지 않는다. 별도 SPR 실험의 리나글립틴 Kd에는 Outside typical range 표시가 있어 대표 비교값으로 택하지 않았다.\n\n## 출발 약물 제안\n\n**시타글립틴을 입문 출발 약물로 추천한다.** 실험 구조와 초기 구조–활성 연구가 연결되어 있고, 입체중심 1개를 보존하며 변형을 설명하기 좋다. [PDB 1X70](https://www.rcsb.org/structure/1X70)은 2.10 Å X선 구조이며 변이가 있어 야생형 서열과 동일시하지 않는다. 리나글립틴도 [PDB 2RGU](https://www.rcsb.org/structure/2RGU), 2.60 Å, 변이 없음으로 연결된다. 알로글립틴은 세 후보 중 계산 분자량이 가장 작아 소분자 변형 비교에 적합하다. 알로글립틴의 PDB 구조는 이번 비교에서 별도 확인하지 않았다.\n\n개선 목표 제안은 **DPP4 결합 예측을 유지하면서 분자량을 낮추고, 용해도·흡수·독성 예측이 악화되지 않는 후보 탐색**이다. 이는 실습을 위한 다목적 탐색 가설이며 기존 약물에 임상적 문제가 있다는 주장이나 개선 성공 보장이 아니다. 대안은 결합 유지 + 용해도 예측 개선, 또는 친화도 예측 개선 + ADMET 유지다. 작은 10회 생성에서 조건을 모두 만족하는 후보가 없을 수 있다.\n\nAlogP와 PubChem XLogP, 극성 표면적은 계산법·표현 차이가 있어 서로 바꾸어 사용하지 않는다. 예를 들어 시타글립틴 ChEMBL ALogP 2.02와 PubChem XLogP 0.7은 실측값이 아니며 하나로 평균내지 않는다. 이후 비교는 동일 모델·동일 산출법으로 수행한다. BBB는 당뇨병의 주 평가 목표가 아니므로 보조 기록으로만 취급한다.\n\n## 조회 경로와 원문\n\nChEMBL_get_molecule 및 ChEMBL_get_drug_mechanisms의 REST 호출 6건은 HTTP 500/시간 초과로 실패했다. 실패 원문을 유지하고, 공식 ChEMBL Elasticsearch 서버를 읽는 프로젝트 보조 도구 ChEMBL_index_query를 일반 ToolUniverse MCP에 등록해 ChEMBL 37 레코드를 받았다. 이는 API 경로 대체이며 다른 데이터베이스의 추정값으로 채운 것이 아니다.\n\n- [타깃 원문](../raw/stage03/DPP4-target-index.json)\n- [기전 원문](../raw/stage03/mechanisms-parent-index.json)\n- [활성 원문](../raw/stage03/DPP4-drug-activities-index.json), 큰 응답은 같은 디렉터리의 full.json과 SHA-256으로 연결\n- [구조·물성·개별 원문 경로](../data/starting-drug-comparison.json)\n- 구조 웹 조회 원문: raw/stage03/structure-web-verification.json\n\n이 비교 후 사용자 선택을 기록하고 후보 생성으로 진행했다. 실제 결과는 [4·5단계 보고서](04-05-analogs-and-generation.md)와 [진행 상태](../data/progress.json)를 따른다.\n"},{"title":"유사체와 생성 결과","file":"04-05-analogs-and-generation.md","text":"# 시타글립틴 유사체와 생성 결과\n\n사용자는 시타글립틴과 ‘결합 예측 유지 + 분자량 감소, ADMET 악화 여부 확인’을 선택했다. 결정 원문은 [선택 기록](../data/user-decisions-stage3.json)에 보존했다.\n\n## 기존 유사체 2개\n\nChEMBL 전체 유사도 검색은 `epam.indigo` 의존성 부재로 실패했다. 일반 REST 경로에도 앞선 장애가 있어, 공식 ChEMBL 37 검색 서버에서 시타글립틴 최초 논문 [PMID 15634008](https://pubmed.ncbi.nlm.nih.gov/15634008/)의 사람 DPP4 활성 기록 10개를 받아 비교했다. 따라서 **이 논문 안에서 가까운 유사체**이며 ChEMBL 전체에서 가장 가까운 두 물질이라는 뜻은 아니다.\n\n염의 작은 성분을 제거하고 중성 모체로 통일한 뒤 RDKit Morgan fingerprint(radius 2, 2048 bits, 입체화학 포함)의 Tanimoto 유사도로 정렬했다. 시타글립틴 염산염 CHEMBL539077은 모체가 같아 별도 유사체에서 제외했다. 정규화 전 구조와 측정 레코드는 그대로 보존했다.\n\n| 비교 분자 | 중성 모체 계산 분자량 | 시타글립틴과 유사도 | 동일 assay IC50 |\n|---|---:|---:|---:|\n| 시타글립틴 | 407.318 | 1.000 | 18 nM |\n| CHEMBL558585 | 457.325 | 0.852 | 71 nM |\n| CHEMBL537400 | 389.328 | 0.804 | 27 nM |\n\n실험은 CHEMBL829504에 속하며, 표의 활성은 실험 기록이고 분자량·유사도는 계산값이다. 염 형태 실험의 농도를 계산 모체 질량과 혼동하지 않는다. CHEMBL537400은 분자량 감소와 활성 변화의 실제 비교 사례지만, 생성 후보가 같은 거동을 보인다는 근거는 아니다.\n\n실험 염 레코드 CHEMBL558585의 중성 모체 ID는 **CHEMBL517072**, CHEMBL537400의 중성 모체 ID는 **CHEMBL216186**이다. 별도로 모체 레코드를 조회해 정규화한 입체 SMILES와 일치함을 확인했다. 모델 입력은 이 중성 모체이고, 표와 파일명에는 실험 출처를 추적할 수 있도록 염 레코드 ID를 유지했다. [모체 식별자 검증](../data/analog-identity-verification.json).\n\n원문: [활성 10개](../raw/stage04/original-paper-activities.json), [CHEMBL558585 구조](../raw/stage04/CHEMBL558585-identity.json), [CHEMBL537400 구조](../raw/model-checks/CHEMBL537400-identity.json). 전체 정렬·정규화 내역: [known-analogs.json](../data/known-analogs.json).\n\n## 생성 10회\n\nMol2Mol 5회와 LibInvent 5회, 총 10회 실제 샘플링을 수행했다. 모든 원출력과 중복을 보존했고 대체 추출은 하지 않았다. Mol2Mol은 난수 seed 20261016, LibInvent는 20261017을 사용했다. 두 모델 모두 REINVENT4 v4.7, CPU, temperature 1.0, multinomial 설정이다. 라이브러리 구현과 CPU 수치 연산 차이 때문에 다른 환경에서의 비트 단위 재현을 보장하지는 않는다.\n\nLibInvent의 CF3 치환 위치 1곳을 변경 대상으로 삼고, 베타-아미노 아마이드·융합 고리·트리플루오로페닐 부분을 유지했다. 원래 CF3를 다시 연결하면 시타글립틴의 입체 SMILES와 일치함을 확인했다.\n\n기존 LibInvent 가중치의 어휘에는 `[C@@H]`가 없어 첫 호출이 입력 인코딩에서 실패했다. 이 실패는 모델의 샘플 추출 이전이며 추출 수는 0회다. 호환 입력에서 입체 표시를 제거한 뒤 5회 추출하고, 유일하게 대응되는 고정 골격의 아미노 탄소에 원래 R 배치를 복원했다. 이는 알려진 출발 골격의 입체배치를 유지하는 후처리이며 모델이 입체화학을 예측한 것이 아니다. 원래의 비입체 출력과 복원 후 구조를 모두 기록했다.\n\n| 항목 | 결과 |\n|---|---:|\n| 실제 추출 | 10회 |\n| 구조 파싱 유효 | 10개 |\n| 고유 구조, 출발 약물 포함 | 7개 |\n| 출발 약물과 다른 고유 후보 | 6개 |\n| LibInvent의 출발 약물 재생성 | 4회 |\n| 출발 약물보다 분자량이 작은 후보 | 4개 |\n\n| 후보 | 생성 모델 | 계산 분자량 | 출발 약물 대비 변화 |\n|---|---|---:|---:|\n| M1 | Mol2Mol | 397.357 | −9.961 |\n| M2 | Mol2Mol | 421.345 | +14.027 |\n| M3 | Mol2Mol | 406.368 | −0.950 |\n| M4 | Mol2Mol | 387.793 | −19.525 |\n| M5 | Mol2Mol | 421.345 | +14.027 |\n| L1 | LibInvent + 고정 골격 입체 복원 | 389.328 | −17.990 |\n\n분자량 감소는 구조에서 계산한 결과다. 아직 결합 유지·ADMET 개선·신규성을 뜻하지 않는다. 큰 후보 M2·M5도 동일한 평가 집합에 포함해 결과를 선택적으로 누락하지 않는다.\n\n원문: [Mol2Mol](../raw/model-checks/mol2mol-check-1.json), [LibInvent 인코딩 실패](../raw/model-checks/libinvent-check-1.json), [LibInvent 최종](../raw/model-checks/libinvent-final.json). [생성 입력 설계](../data/generation-design.json), [전체 10회와 후처리](../data/generated-candidates.json), [공통 평가 분자 9개](../data/evaluation-molecules.json).\n\nMol2Mol의 로드 로그에는 REINVENT 내부 메타데이터의 `invalid hash` 검사 실패가 있었다. 실행한 파일의 SHA-256은 프로젝트에 기록한 기존 자산 값과 일치했고, 로더는 검사 실패를 기록한 뒤 모델을 로드해 생성했다. 내부 해시 불일치 원인을 해결했다고 주장하지 않는다. Zenodo의 독립 upstream 체크섬 재조회는 HTTP 403으로 실패했다. 원문은 [Mol2Mol 로그](../raw/stage05/mol2mol-worker.txt)와 `raw/setup/reinvent-official-checksums.json`, 로그 보존 해시는 `raw/stage05/log-provenance.json`이다.\n\n분자 구조는 [9개 평가 분자 그림](evaluation-structures.svg)에서 함께 볼 수 있다.\n\n## 다음 평가\n\n출발 약물 1개, 기존 유사체 2개, 생성 후보 6개를 Boltz-2와 ADMET-AI로 평가한다. 동일 구조 재생성 4회에는 중복 모델 계산을 하지 않는다. 8단계 특허·기존 물질 조사는 현재 요청 범위 밖이며 신규성 판정을 하지 않았다.\n"},{"title":"결합·ADMET 최종 비교","file":"06-07-binding-admet-comparison.md","text":"# DPP4·시타글립틴: 결합 및 ADMET 비교\n\n상태: **7단계까지 계산·비교 완료**. Boltz-2 9/9개, ADMET-AI 9/9개.\n\n사용자가 선택한 목표는 **결합 예측 유지 + 분자량 감소, ADMET 악화 여부 확인**이다. 10회 생성에서 출발 약물과 다른 유효한 고유 후보 6개를 얻었고, 이 중 4개는 계산 분자량이 작다. 출발 약물·기존 유사체 2개·생성 후보 6개를 공통 집합으로 평가했다. [분자 구조 그림](evaluation-structures.svg), [생성 보고서](04-05-analogs-and-generation.md).\n\n**이번 선별 기준으로 목표를 모두 만족한 후보: 없음.** 분자량 감소와 두 결합 지표의 상대 조건에 함께 해당한 M3는 용해도·hERG·DILI·CYP 모델 출력에서 불리한 변화가 나타났다. 분자량 감소 자체는 약 0.95 g/mol로 작다. 이는 모델 기반 선별 결과이며 실제 효능·독성을 판정한 것이 아니다.\n\n## 해석의 우선 조건\n\n**양성 대조약의 예측이 알려진 활성과 잘 맞지 않는다.** 시타글립틴의 모델 결합 확률은 0.190, 친화도 출력은 1.182이다. 후자는 log10(IC50/μM)이며 단순 환산하면 약 15.22 μM다. 같은 비교 논문의 실험 IC50 18 nM와 큰 차이가 있다. 이 모델은 해당 실험 조건의 IC50를 직접 재현하도록 맞춘 도구가 아니므로 수치 차이를 임상 성능으로 해석하지 않는다.\n\n구조 신뢰도는 예측 구조에 대한 지표이며 결합 확률·실험 활성과 다르다. 단일 사슬 근사와 단일 난수 seed, 모델 오차 때문에 아래의 상대 수치가 좋아도 실제 결합 유지나 약물 개선을 입증하지 않는다. 입력은 데이터베이스의 중성 모체 구조이며 pH별 양성자화 상태를 따로 비교하지 않았다. 이 선택이 오차의 원인이라고 확인한 것은 아니다. Boltz 문서는 친화도 수치 비교를 활성 분자 간 최적화 용도로 설명하며, 생성 후보의 실험 활성은 아직 없다. 따라서 생성 후보의 친화도 수치는 탐색적 가설로만 사용한다.\n\n## 6단계: 같은 조건의 Boltz-2 비교\n\nBoltz 2.2.1, RTX 2080 Ti, seed 20261016, recycling 3, 구조 diffusion 200 steps/1 sample, affinity 200 steps/5 samples, max parallel 1, no_kernels로 실행했다. 모델의 두 affinity head 출력도 원문에 보존했다. 이를 독립 반복 실험이나 신뢰구간으로 취급하지 않는다.\n\n단백질은 UniProt P27487 야생형의 39–766번, 728 aa인 세포외 구간 단일 사슬이다. 이는 조회한 재조합 DPP4 실험의 구성 범위와 맞추며 막 구간을 제외한다. 원래 최적 활성에는 동종이합체가 관여하므로 이번 단일 사슬·비당화 모델은 근사다. ColabFold에서 얻은 공통 MSA 10,189행 중 메모리 제한에 맞춰 최대 256행을 사용했다. 실험 구조 템플릿·강제 pocket 제약은 사용하지 않았다. [서열·구성·MSA 근거](../data/binding-target.json).\n\n| 분자 | 분자량 | 실험 IC50 (nM) | 친화도 출력¹ | 결합 확률² | 구조 신뢰도³ |\n|---|---:|---:|---:|---:|---:|\n| sitagliptin | 407.32 | 18 | 1.182 | 0.190 | 0.942 |\n| CHEMBL558585 | 457.33 | 71 | 0.882 | 0.230 | 0.909 |\n| CHEMBL537400 | 389.33 | 27 | 1.446 | 0.193 | 0.943 |\n| M1 | 397.36 | — | 1.054 | 0.150 | 0.948 |\n| M2 | 421.35 | — | 1.638 | 0.171 | 0.923 |\n| M3 | 406.37 | — | 0.948 | 0.217 | 0.940 |\n| M4 | 387.79 | — | 1.519 | 0.262 | 0.939 |\n| M5 | 421.35 | — | 1.026 | 0.220 | 0.911 |\n| L1 | 389.33 | — | 1.320 | 0.201 | 0.943 |\n\n¹ log10(IC50/μM), 낮을수록 강한 결합 예측. ² 0–1 모델 분류 출력. ³ 0–1 모델 구조 신뢰도. 실험 IC50는 CHEMBL829504의 기록이며 생성 후보는 실험값이 없어 —로 표시했다. 예측값을 실험값 칸에 채우지 않았다.\n\n[결합 CSV](binding-predictions.csv), [단위·설정·개별 원문 경로](../data/binding-evaluation.json), [구조 CIF와 로그의 해시 목록](../data/evaluation-artifacts.json).\n\n## 7단계: ADMET 비교\n\n기본 ADMETAI MCP 호출은 응답이 없어 완료 미확인으로 남겼다. 별도 프로젝트 연결에서 실제 로드·추론을 확인한 ADMET-AI 2.0.1을 사용한다. 아래 분류 출력은 모델 점수이며 환자에게 해당 부작용이 생길 확률이나 임상 안전성 등급이 아니다. BBB는 이번 말초 표적 개선 목표의 주 순위 지표로 사용하지 않는다.\n\n| 분자 | 용해도 log(mol/L) | 경구 생체이용률 점수 | AMES | hERG | DILI |\n|---|---:|---:|---:|---:|---:|\n| sitagliptin | -1.537 | 0.894 | 0.338 | 0.445 | 0.556 |\n| CHEMBL558585 | -2.090 | 0.814 | 0.215 | 0.571 | 0.533 |\n| CHEMBL537400 | -1.543 | 0.888 | 0.321 | 0.464 | 0.541 |\n| M1 | -1.461 | 0.878 | 0.270 | 0.398 | 0.626 |\n| M2 | -2.319 | 0.887 | 0.251 | 0.546 | 0.515 |\n| M3 | -2.401 | 0.810 | 0.208 | 0.787 | 0.823 |\n| M4 | -1.906 | 0.878 | 0.240 | 0.563 | 0.574 |\n| M5 | -2.365 | 0.894 | 0.250 | 0.574 | 0.606 |\n| L1 | -1.204 | 0.887 | 0.388 | 0.481 | 0.520 |\n\n용해도는 값이 클수록 모델상 더 잘 녹는 방향이다. AMES·hERG·DILI는 각각 해당 데이터셋의 양성 분류 점수다. 임의의 한 임계값으로 안전·위험을 확정하지 않는다.\n\n**물리 범위 밖 회귀 출력:** sitagliptin (VDss_Lombardo, Clearance_Hepatocyte_AZ); CHEMBL558585 (Clearance_Hepatocyte_AZ); CHEMBL537400 (VDss_Lombardo, Half_Life_Obach, Clearance_Hepatocyte_AZ); M1 (VDss_Lombardo, Half_Life_Obach); M2 (VDss_Lombardo, Clearance_Hepatocyte_AZ); M3 (VDss_Lombardo, Half_Life_Obach, Clearance_Hepatocyte_AZ); M4 (Clearance_Hepatocyte_AZ); M5 (VDss_Lombardo, Clearance_Hepatocyte_AZ); L1 (VDss_Lombardo, Clearance_Hepatocyte_AZ, Clearance_Microsome_AZ). 원값은 보존하고 평가용 값은 null로 두었다. 음수 청소율·분포용적·반감기를 물리적인 예측값으로 채택하거나 양수로 임의 보정하지 않았다.\n\n대사 효소·청소율·단백결합·BBB 등 전체 항목과 출발 약물 대비 변화는 [ADMET CSV](admet-predictions.csv)와 [원값·평가용 값·품질 표시](../data/admet-evaluation.json)에 있다. CYP 억제 모델 점수 증가도 아래 변화 표시에 포함한다. CYP 기질성, 단백결합률·청소율·반감기의 증감은 목표 노출량·투여경로에 따라 의미가 달라 일률적으로 좋고 나쁨을 판정하지 않는다. 단위는 [설치 모델의 항목 설명](../data/admet-endpoints.json)을 함께 확인한다. 누락 또는 유효하지 않은 항목은 개선 여부 미확인이다.\n\n## 목표에 따른 검토\n\n분자량이 작고, 시타글립틴 대비 친화도 출력이 높아지지 않으며 결합 확률이 낮아지지 않는지를 상대 선별 기준으로 기록했다. 이는 통계적으로 검증한 동등성 기준이 아니다. ADMET에서는 독성 분류 점수 +0.1, 용해도 −0.5 log 단위, 생체이용률 점수 −0.1을 설명용 변화 표시로만 쓴다. 기준은 생성 후보 예측을 모으기 전에 [evaluation-criteria.json](../data/evaluation-criteria.json)에 기록했다.\n\n단순 상대 조건을 함께 만족한 생성 후보: **M3**. 양성 대조약의 보정 한계가 있어 이를 ‘결합 유지 성공’으로 판정하지 않는다.\n\n| 후보 | 분자량 변화 | 친화도 출력 변화 | 결합 확률 변화 | ADMET 변화 표시 |\n|---|---:|---:|---:|---|\n| M1 | -9.96 | -0.129 | -0.040 | 물리 범위 밖 2개 항목 미확인 |\n| M2 | 14.03 | 0.456 | -0.019 | hERG 점수 +0.1 초과; 용해도 −0.5 log 초과; 물리 범위 밖 2개 항목 미확인 |\n| M3 | -0.95 | -0.235 | 0.028 | hERG 점수 +0.1 초과; DILI 점수 +0.1 초과; CYP1A2_Veith 점수 +0.1 초과; CYP2C19_Veith 점수 +0.1 초과; CYP2C9_Veith 점수 +0.1 초과; CYP2D6_Veith 점수 +0.1 초과; CYP3A4_Veith 점수 +0.1 초과; 용해도 −0.5 log 초과; 물리 범위 밖 3개 항목 미확인 |\n| M4 | -19.53 | 0.336 | 0.072 | hERG 점수 +0.1 초과; CYP2C19_Veith 점수 +0.1 초과; 물리 범위 밖 1개 항목 미확인 |\n| M5 | 14.03 | -0.156 | 0.031 | hERG 점수 +0.1 초과; CYP3A4_Veith 점수 +0.1 초과; 용해도 −0.5 log 초과; 물리 범위 밖 2개 항목 미확인 |\n| L1 | -17.99 | 0.137 | 0.012 | 물리 범위 밖 3개 항목 미확인 |\n\n[ADMET 변화량 CSV](admet-deltas.csv). 변화 표시가 없더라도 실제 안전성이나 전체 ADMET의 동등성을 입증하지 않는다.\n\n**이번 결과는 후속 검증할 구조를 좁히기 위한 계산 실습 결과다.** 관심 후보의 실험 활성·선택성·용해도·세포 독성을 확인하고, 먼저 알려진 DPP4 억제제를 재현하는 결합 평가 조건을 검증해야 한다. 다중 seed, 이합체·당화 영향과 모델 밖 영역에 대한 점검은 후속 확장으로 남겼다. 8단계 DB·특허 조사를 수행하지 않았으므로 구조의 신규성·특허 비침해를 판단하지 않는다.\n\n## 재현 자료\n\n[공통 분자 입력](../data/evaluation-molecules.json), [완전성 검증](../data/evaluation-validation.json), [실행 기록](../data/evaluation-run.json), [환경·실패·호환 처리](../docs/SETUP.md).\n\n공식 지표 설명: [Boltz prediction 문서](https://github.com/jwohlwend/boltz/blob/main/docs/prediction.md). 조회 원문은 `raw/setup/boltz-prediction-documentation.json`이다. ADMET 패키지의 항목 설명과 해시는 `raw/setup/admet-ai-2.0.1-endpoints.*`에 보존했다.\n"},{"title":"2단계 조회 결과 해설","file":"02-target-query-findings.md","text":"# 2단계: 세 표적에서 네 조회로 무엇을 알아보았나\n\n이 문서는 2026-10-16에 저장한 조회 결과를 설명하는 보충 기록이다. 새 연구 실행이나 기존 선택의 변경이 아니다. DPP4·SLC5A2·PPARG는 유전자 기호이고, 대응하는 단백질은 DPP-4 효소·SGLT2 수송체·PPARγ 핵수용체다.\n\n네 조회는 질환과의 유전학적 연결, 기존 약물을 통한 연구 가능성, 정상 조직에서의 발현, 표적 조절 시 검토할 생물학적 영향과 안전성 주석을 조사했다. 유전학 조회만 제2형 당뇨병 ID를 입력했고, 나머지 세 조회는 유전자 ID만 입력했다. 따라서 약물·발현·안전성 결과 전체가 당뇨병에 한정되는 것은 아니다. 도구의 완료는 응답을 받았다는 뜻이며 근거의 확실성이나 안전성 판정이 아니다.\n\n## 네 도구의 질문\n\n| 실제 도구 | 단백질에 관해 확인하려던 내용 | 읽는 방법 |\n|---|---|---|\n| OpenTargets_get_evidence_by_datasource | 이 단백질을 만드는 유전자가 사람의 당뇨병 위험과 유전학적으로 연결되는가? | 특정 질환·출처에 해당하는 근거 기록. 인과성, 억제/활성화 방향, 치료 효과를 이 응답만으로 확정하지 않는다. |\n| OpenTargets_get_asso_drug_by_targ_ense | 이 표적과 연결된 기존 약물·개발 후보가 있어 출발 분자와 비교군을 확보할 수 있는가? | 약물 ID·이름·개발 단계·관련 질환 목록. 염 형태와 다른 적응증, 개발 후보가 섞여 있다. |\n| OpenTargets_get_targ_expr_by_ense | 이 유전자/단백질이 정상 상태의 어떤 조직·세포에서 발현되는가? | 여러 RNA·단백질 측정 자료가 반환됐다. 이번 비교는 GTEx RNA의 중앙값(TPM)만 사용했다. |\n| OpenTargets_get_targ_safe_prof_by_ense | 이 표적을 조절할 때 살펴야 할 생물학적 영향·안전성 관련 기록이 있는가? | 세포·생화학·전임상·임상 관련 주석을 구분한다. 주석 수는 위험 점수가 아니다. |\n\n도구별 데이터 정의: [유전학 근거](https://platform-docs.opentargets.org/evidence), [약물과 개발 후보](https://platform-docs.opentargets.org/target/drugs), [기초 발현](https://platform-docs.opentargets.org/target/baseline-expression), [표적 안전성](https://platform-docs.opentargets.org/target/safety).\n\n## DPP4 → DPP-4 효소\n\n**유전학 결과:** 제2형 당뇨병 MONDO_0005148, 출처 gwas_credible_sets·gene_burden·eva, 최대 30개 조건에서 0건. 이번 경로로 사람의 유전학적 뒷받침을 확보하지 못했다. 당뇨병과 무관하거나 DPP-4 억제제가 효과 없다는 뜻은 아니다. [원문](../raw/stage02/DPP4-genetic-evidence.json)\n\n**약물 결과:** 전체 21개 기록을 받았고, 그중 20개에 선택한 당뇨병 ID가 포함됐다. 시타글립틴 CHEMBL1422, 리나글립틴 CHEMBL237500, 알로글립틴 CHEMBL376359 등이 포함되며 이 세 약물의 drug.maximumClinicalStage는 APPROVAL이다. 연구의 출발 약물과 비교 약물을 확보할 수 있다는 근거다. 21개가 모두 서로 다른 승인된 당뇨병 약이라는 뜻은 아니다. [원문](../raw/stage02/DPP4-drugs.json)\n\n**발현 결과:** 전체 1,474개 기록 중 GTEx·TPM에 해당하는 51개 기록을 비교했다. 높은 중앙값 예시는 파이어판(장 림프조직) 18.1174, 전립선 18.0738, 신장 피질 13.4355 TPM이다. 여러 정상 조직에서 RNA가 관찰되므로 표적 조절의 영향을 한 조직에만 한정해서 해석하지 않는다. 이 값은 DPP-4 단백질의 양이나 효소 활성, 당뇨병 환자에서의 발현 증가를 직접 측정한 값이 아니다. [전체 응답](../raw/stage02/DPP4-expression.full.json), [호출 기록](../raw/stage02/DPP4-expression.json)\n\n**안전성 결과:** 응답에는 target.id와 approvedSymbol만 있고 safetyLiabilities 필드가 없다. 안전성 정보는 미확인이다. 위험이 0이거나 안전성이 입증됐다는 의미가 아니다. [원문](../raw/stage02/DPP4-safety.json)\n\n**비교에 사용한 해석:** 이 네 조회에서는 기존 약물의 연결성이 강점이고, 유전학적 근거와 안전성 자료에 공백이 남는다. 최종 DPP4 선택에는 별도로 확인한 실험 구조·유사체 자료와 입문 실습의 진행 가능성도 반영했다.\n\n## SLC5A2 → SGLT2 수송체\n\n**유전학 결과:** DPP4와 같은 질환·출처 조건에서 0건. 이번 유전학 조회에서는 미확인이며, SGLT2가 치료 표적이라는 근거 전체를 부정하지 않는다. [원문](../raw/stage02/SLC5A2-genetic-evidence.json)\n\n**약물 결과:** 전체 17개 기록을 받았고 모두 선택한 당뇨병 ID를 포함한다. 엠파글리플로진 CHEMBL2107830, 다파글리플로진 CHEMBL429910, 카나글리플로진 CHEMBL4594217 등이 포함되며 이 세 약물의 drug.maximumClinicalStage는 APPROVAL이다. 출발 분자와 비교 약물을 구할 수 있는 표적이다. 염·형태와 개발 후보가 포함되므로 17종의 승인약으로 세지 않는다. [원문](../raw/stage02/SLC5A2-drugs.json)\n\n**발현 결과:** 전체 1,460개 기록 중 GTEx·TPM 51개를 비교했다. 신장 피질 32.0544, 고환 15.0373, 신장 바깥 수질 1.06403 TPM이 높은 값의 예시다. 신장 피질의 높은 RNA 발현은 신장에서 포도당을 재흡수하는 단백질이라는 배경과 부합하는 해석이다. 고환 등 다른 조직에도 RNA 신호가 있으므로 신장에만 존재한다고 단정하지 않는다. RNA 신호만으로 해당 조직의 단백질 활성이나 부작용을 확정할 수 없다. [전체 응답](../raw/stage02/SLC5A2-expression.full.json), [호출 기록](../raw/stage02/SLC5A2-expression.json)\n\n**안전성 결과:** safetyLiabilities 필드가 반환되지 않아 미확인이다. SGLT2 억제제의 안전성이 좋다거나 부작용이 없다는 결론을 내릴 수 없다. [원문](../raw/stage02/SLC5A2-safety.json)\n\n**비교에 사용한 해석:** 기존 약물과 신장 발현 자료가 연구 가능성을 뒷받침하지만, 이번 유전학·안전성 조회에는 공백이 남는다. 막단백질 모델링 조건 검토는 이 네 응답 밖의 별도 과제다.\n\n## PPARG → PPARγ 핵수용체\n\n**유전학 결과:** 같은 조회 조건에서 전체 65개 근거 중 요청 상한인 30개를 받았다. 받은 30개는 모두 gwas_credible_sets이고 서로 다른 문헌 ID는 18개다. 사람의 유전체 연관 신호를 PPARG와 연결한 근거가 존재한다. 65편의 논문이나 독립적인 실험 65회라는 뜻은 아니며, 미수신한 35개를 검토했다고 주장하지 않는다. 구체적인 변이의 기능 방향·효과 크기는 이 응답에 없어 약물의 활성화 방향을 여기서 확정하지 않았다. [원문](../raw/stage02/PPARG-genetic-evidence.json)\n\n**약물 결과:** 전체 40개 기록을 받았고 23개에 선택한 당뇨병 ID가 포함됐다. 피오글리타존 CHEMBL595, 로시글리타존 CHEMBL121 등이 포함되며 두 약물의 drug.maximumClinicalStage는 APPROVAL이다. 표적과 연결된 기존 약물·개발 후보가 있어 비교 분자를 확보할 수 있다. 40개를 모두 당뇨병 승인약으로 해석하지 않는다. [원문](../raw/stage02/PPARG-drugs.json)\n\n**발현 결과:** 전체 1,409개 기록 중 GTEx·TPM 51개를 비교했다. 피하 지방조직 61.8041, 대망 지방조직 57.1724, 유방 상피 42.6131 TPM이 높은 값의 예시다. 지방조직의 높은 RNA 발현은 지방세포·대사 조절이라는 배경과 부합하는 해석이다. 발현량으로 인슐린 감수성 개선의 크기나 안전성을 계산한 것은 아니다. [전체 응답](../raw/stage02/PPARG-expression.full.json), [호출 기록](../raw/stage02/PPARG-expression.json)\n\n**안전성 결과:** 20개 주석을 받았으며 내용과 근거 유형이 다르다. [원문](../raw/stage02/PPARG-safety.json)\n\n| 원문 출처·유형 | 실제 기록의 내용 | 해석 범위 |\n|---|---|---|\n| Lynch et al. (2017), preclinical, 11개 | 활성화/증가 방향에 심부전, 체중·심장 무게 증가, 혈장량·수분 저류 증가, 소변·요중 나트륨 배설 감소 등이 연결됨. 혈당·염증·혈소판 응집 감소도 포함. 억제/감소 방향에는 염증 증가가 기록됨. | 표적 조절로 검토할 생리적 영향. 모두 독성 사건이 아니며 사람에서의 발생률도 아님. |\n| ToxCast, 세포·생화학, 3개 | 단백질 안정화, 수용체 결합, 전사인자 활성 조절 실험 주석 | 표적 활성 측정 관련 기록. 사람의 부작용 3종이라는 뜻이 아님. |\n| AOP-Wiki, cell-based, 4개 | 간 지방증 관련 3개 기록과 비만 관련 1개 기록 | 세포·기전 기반 경로 주석. 별개의 임상 사건 4종으로 세지 않음. |\n| ClinPGx, clinical, 2개 | 아스피린 과민반응, 올란자핀 유발 체중 증가와 유전 변이의 연결 | 해당 약물·유전적 맥락을 가진 기록. 피오글리타존의 부작용으로 옮겨 쓰지 않음. |\n\n**비교에 사용한 해석:** 유전학적 근거와 기존 약물이 모두 확보됐다. 동시에 표적 조절 시 검토할 주석이 있어 작용 방향과 근거 맥락을 살펴야 한다. 자료가 더 많이 반환됐다는 이유로 다른 두 표적보다 위험하다고 순위를 매기지 않는다.\n\n## 공통 해석과 범위\n\n약물 응답의 drug.maximumClinicalStage와 바깥 maxClinicalStage는 서로 다른 필드다. 일부 기록에 APPROVAL과 WITHDRAWAL이 함께 있으므로, 이 요약값만으로 약물이 모든 국가·적응증에서 시장 철수됐다고 해석하지 않았다. 실제 승인·경고 사항의 검토는 [기존 1–2단계 보고서](01-02-target-comparison.md)에 보존된 규제 문서 근거와 구분한다.\n\n발현 전체 응답에는 출처·기술·단위가 다른 자료가 섞여 있다. 이번 비교는 GTEx RNA 중앙값(TPM, 백만 전사체당 환산량)으로 한정했다. 51개는 반환된 GTEx 기록 수이며 중복 조직 라벨이 있을 수 있어 51종의 고유 조직이라는 뜻은 아니다. 화면 응답이 길어 별도 회수한 전체 파일의 출처·해시 기록도 보존되어 있다: [DPP4](../raw/stage02/DPP4-expression.full.json.provenance.json), [SLC5A2](../raw/stage02/SLC5A2-expression.full.json.provenance.json), [PPARG](../raw/stage02/PPARG-expression.full.json.provenance.json).\n\n근거 층위는 원문에 맞춰 표시했다. 유전학은 사람의 연관 자료(T1 유형이되 유전자 연결 추론 포함), 약물 목록은 정리된 DB 연결(T2), GTEx는 조직 RNA 측정 자료, 안전성은 반환된 세포·생화학·전임상·임상 유형을 그대로 구분했다. 이 조회를 새로운 실험·모델 예측·임상 효과 검증으로 설명하지 않는다.\n\n단백질 기능 배경 출처: [DPP4](https://www.ncbi.nlm.nih.gov/gene/1803), [SLC5A2](https://www.ncbi.nlm.nih.gov/gene/6524), [PPARG](https://www.ncbi.nlm.nih.gov/gene/5468/). 배경 설명은 네 조회의 직접 반환값과 구분한다.\n"},{"title":"3단계 재조회·다른 DB 확인","file":"03-recheck-and-cross-database.md","text":"# 3단계 재조회·다른 DB 교차 확인\n\n사용자 요청으로 2026-10-17에 조회를 다시 수행했다. 이전 실패 원문과 사용자 선택, 최초 비교표는 보존했다. 적용 스킬은 tooluniverse-small-molecule-discovery이며, 실제 스키마 확인 후 일반 ToolUniverse MCP를 사용했다. 새 모델 추론은 수행하지 않았다.\n\n## 결과\n\nChEMBL_get_molecule 3건과 ChEMBL_get_drug_mechanisms 3건, 합계 6건 중 6건이 이번 재시도에서 성공했다. 약물 구조와 DPP4 억제 기전이 실제 응답에 포함됐다. 과거 실패 원인의 복구 경위까지 확인한 것은 아니다.\n\nPubChem에서 이름→CID→구조 조회를 다시 수행했고, 별도 DB인 IUPHAR/BPS Guide to Pharmacology(GtoPdb)에서 약물 구조와 사람 DPP4 상호작용을 조회했다. 세 DB의 입체 InChIKey가 3/3개 약물에서 일치했고, 기존 연구에 사용한 구조와도 3/3개가 일치했다.\n\n| 약물 | ChEMBL 구조 / 기전 | PubChem CID | GtoPdb ligand ID | 세 DB 구조 일치 | GtoPdb 사람 DPP4 억제 |\n|---|---|---:|---:|---|---|\n| 시타글립틴 | success / success | 4369359 | 6286 | 일치 | 확인 |\n| 리나글립틴 | success / success | 10096344 | 6318 | 일치 | 확인 |\n| 알로글립틴 | success / success | 11450633 | 6319 | 일치 | 확인 |\n\n## 약물별 원문과 확인 내용\n\n### 시타글립틴 · CHEMBL1422\n\n구조 InChIKey: MFFMDFFZMYYVKS-SECBINFHSA-N. ChEMBL 구조 SMILES: N[C@@H](CC(=O)N1CCn2c(nnc2C(F)(F)F)C1)Cc1cc(F)c(F)cc1F. SMILES 표기 순서는 DB마다 달라질 수 있어 문자열 동일성 대신 입체 구조 식별자를 대조했다.\n\nChEMBL 기전 기록 3개에서 표적 CHEMBL284, action INHIBITOR, direct_interaction 1을 확인했다. 기전이 염 형태에 기록되어 있어 parent_molecule_chembl_id로 선택한 모체와 연결했다.\n\n[ChEMBL 구조 재조회](../raw/stage03-recheck-2026-10-17/CHEMBL1422-molecule-retry.json) · [ChEMBL 기전 재조회](../raw/stage03-recheck-2026-10-17/CHEMBL1422-mechanism-retry.json) · [PubChem 이름 조회](../raw/stage03-recheck-2026-10-17/sitagliptin-pubchem-cid.json) · [PubChem 구조 조회](../raw/stage03-recheck-2026-10-17/sitagliptin-pubchem-properties.json)\n\nGtoPdb ligand 6286는 ChEMBL ID·PubChem CID·InChIKey가 모두 대응한다. 사람 DPP4, UniProt P27487, targetId 1612의 Inhibitor / Inhibition 기록을 확인했다. [GtoPdb 구조·식별자 원문](../raw/stage03-recheck-2026-10-17/sitagliptin-gtopdb-search.json) · [GtoPdb 표적·작용 원문](../raw/stage03-recheck-2026-10-17/sitagliptin-gtopdb-interactions.json)\n\nGtoPdb가 반환한 활성 표현: pIC50 8.100000381469727. 선택성 필드는 Not Determined이므로 선택성이 입증됐다고 설명하지 않는다.\n\n### 리나글립틴 · CHEMBL237500\n\n구조 InChIKey: LTXREWYXXSTFRX-QGZVFWFLSA-N. ChEMBL 구조 SMILES: CC#CCn1c(N2CCC[C@@H](N)C2)nc2c1c(=O)n(Cc1nc(C)c3ccccc3n1)c(=O)n2C. SMILES 표기 순서는 DB마다 달라질 수 있어 문자열 동일성 대신 입체 구조 식별자를 대조했다.\n\nChEMBL 기전 기록 1개에서 표적 CHEMBL284, action INHIBITOR, direct_interaction 1을 확인했다. 약물과 모체 ID가 같은 기록이다.\n\n[ChEMBL 구조 재조회](../raw/stage03-recheck-2026-10-17/CHEMBL237500-molecule-retry.json) · [ChEMBL 기전 재조회](../raw/stage03-recheck-2026-10-17/CHEMBL237500-mechanism-retry.json) · [PubChem 이름 조회](../raw/stage03-recheck-2026-10-17/linagliptin-pubchem-cid.json) · [PubChem 구조 조회](../raw/stage03-recheck-2026-10-17/linagliptin-pubchem-properties.json)\n\nGtoPdb ligand 6318는 ChEMBL ID·PubChem CID·InChIKey가 모두 대응한다. 사람 DPP4, UniProt P27487, targetId 1612의 Inhibitor / Inhibition 기록을 확인했다. [GtoPdb 구조·식별자 원문](../raw/stage03-recheck-2026-10-17/linagliptin-gtopdb-search.json) · [GtoPdb 표적·작용 원문](../raw/stage03-recheck-2026-10-17/linagliptin-gtopdb-interactions.json)\n\nGtoPdb가 반환한 활성 표현: pKi 9.0. 선택성 필드는 Not Determined이므로 선택성이 입증됐다고 설명하지 않는다.\n\n### 알로글립틴 · CHEMBL376359\n\n구조 InChIKey: ZSBOMTDTBDDKMP-OAHLLOKOSA-N. ChEMBL 구조 SMILES: Cn1c(=O)cc(N2CCC[C@@H](N)C2)n(Cc2ccccc2C#N)c1=O. SMILES 표기 순서는 DB마다 달라질 수 있어 문자열 동일성 대신 입체 구조 식별자를 대조했다.\n\nChEMBL 기전 기록 1개에서 표적 CHEMBL284, action INHIBITOR, direct_interaction 1을 확인했다. 기전이 염 형태에 기록되어 있어 parent_molecule_chembl_id로 선택한 모체와 연결했다.\n\n[ChEMBL 구조 재조회](../raw/stage03-recheck-2026-10-17/CHEMBL376359-molecule-retry.json) · [ChEMBL 기전 재조회](../raw/stage03-recheck-2026-10-17/CHEMBL376359-mechanism-retry.json) · [PubChem 이름 조회](../raw/stage03-recheck-2026-10-17/alogliptin-pubchem-cid.json) · [PubChem 구조 조회](../raw/stage03-recheck-2026-10-17/alogliptin-pubchem-properties.json)\n\nGtoPdb ligand 6319는 ChEMBL ID·PubChem CID·InChIKey가 모두 대응한다. 사람 DPP4, UniProt P27487, targetId 1612의 Inhibitor / Inhibition 기록을 확인했다. [GtoPdb 구조·식별자 원문](../raw/stage03-recheck-2026-10-17/alogliptin-gtopdb-search.json) · [GtoPdb 표적·작용 원문](../raw/stage03-recheck-2026-10-17/alogliptin-gtopdb-interactions.json)\n\nGtoPdb가 반환한 활성 표현: pIC50 8.5. 선택성 필드는 Not Determined이므로 선택성이 입증됐다고 설명하지 않는다.\n\n## 활성값과 자료 접근의 한계\n\nGtoPdb의 시타글립틴·알로글립틴은 pIC50, 리나글립틴은 pKi다. 지표와 실험 조건이 같지 않아 세 숫자로 약물 순위를 매기거나 기존 동일 실험 CHEMBL2149434의 IC50를 대체하지 않았다. 원래의 18·1·4 nM 비교는 기존 보고서에 그대로 남아 있다. 이번 작업은 구조와 표적 기전의 교차 확인이며 신규 실험 검증이 아니다. 여러 DB가 같은 원 논문을 사용할 수 있으므로 DB 3개를 독립 실험 3회로 해석하지 않는다.\n\nGtoPdb 도구의 응답은 공식 [ligands.csv](https://www.guidetopharmacology.org/DATA/ligands.csv)와 [interactions.csv](https://www.guidetopharmacology.org/DATA/interactions.csv)를 출처로 표시한다. 웹 상세 페이지는 로그인 화면으로 전환되어 상세 본문을 열람했다고 기록하지 않았다. [웹 접근 확인 원문](../raw/stage03-recheck-2026-10-17/gtopdb-web-pages.json). 저장된 도구 응답에서 실제 구조·상호작용 자료를 확인했다.\n\n## 기존 기록과 새 기록의 관계\n\n2026-10-16: 기본 ChEMBL REST 실패 → 공식 ChEMBL 검색 인덱스로 구조·기전·활성 확보 → PubChem 구조 확인 → 사용자 시타글립틴 선택.\n\n2026-10-17: 기본 REST 재시도 성공 → PubChem 재확인 → GtoPdb 구조·사람 DPP4 억제 교차 확인. 출발 약물 선택을 바꿀 구조 불일치는 발견되지 않았다.\n\n정리 데이터: [검증 결과와 원문 SHA-256](../data/stage3-recheck.json). 최초 비교: [출발 약물 비교 보고서](03-starting-drug-comparison.md). 모든 새 호출의 도구명·인자·시각·응답·실패 여부는 raw/stage03-recheck-2026-10-17/에 보존했다.\n"},{"title":"6단계 Boltz-2 입력·계산·출력 해설","file":"06-boltz-inputs-and-outputs.md","text":"# 6단계 Boltz-2: 실제로 무엇을 넣고 무엇을 계산했나\n\n이 문서는 저장된 실행을 설명하는 추가 해설이다. 모델을 재실행하거나 기존 연구 결정·원문·결과를 변경하지 않았다. 인터랙티브 HTML의 6단계에서 9개 분자의 입력 YAML, 원출력 JSON, 예측 구조 CIF와 실행 기록을 선택해 확인할 수 있다.\n\n## 계산의 목적과 범위\n\nDPP4와 각 분자의 3차원 복합체 구조 및 결합 관련 값을 예측해, 생성 후보를 시타글립틴과 같은 조건에서 비교했다. 실행 대상은 시타글립틴 1개, 기존 유사체 2개, Mol2Mol 후보 M1–M5와 LibInvent 후보 L1의 6개로 합계 9개다. 단백질 하나에 약물 9개를 동시에 넣은 계산이 아니라, 단백질 A와 분자 B를 묶어 분자별로 따로 실행했다. 9개 모두 완료 원문과 구조 파일이 있다.\n\n주요 도구는 프로젝트의 `Boltz2_predict_binding`이며, `TherapeuticModels_get_job`으로 완료 결과를 회수했다. 모델은 Boltz-2, 설치 패키지는 boltz 2.2.1이다. 이 단계는 프로젝트 절차를 따랐으며 별도 전용 스킬을 새로 적용한 기록은 없다.\n\n## 고정 입력: 단백질과 MSA\n\n단백질 A에는 UniProt P27487의 야생형 DPP4 서열을 넣었다. 전체 766개 아미노산 중 39–766번, 총 728개를 사용했다. 세포 밖 부분의 단일 사슬이며 막 부위를 제외한다. 저장된 사람 재조합 DPP4 결합 분석 기록 CHEMBL4432069의 구성 범위와 맞춘 선택이다. 시타글립틴 실험값을 비교할 때 사용한 분석 CHEMBL829504와는 서로 다른 기록이다.\n\nMSA는 비슷한 단백질 서열들을 정렬한 정보다. 서열에서 보존되거나 함께 변하는 위치를 통해 구조 추론을 돕는다. ColabFold에서 생성한 공통 MSA는 10,189행이며, 실행에는 최대 256개를 서브샘플링하는 설정을 적용했다. 10,189개 복합체를 계산했다는 의미가 아니다. 모든 분자에 같은 MSA 파일을 재사용했다.\n\n실험 PDB 구조를 입력 템플릿으로 넣거나 특정 포켓을 제약으로 지정하지 않았다. 당사슬, 막, 세포 환경과 DPP4의 동종이합체를 모두 재현한 계산이 아니다.\n\n근거: [단백질·MSA 정의](../data/binding-target.json), [UniProt 조회 원문](../raw/stage06/DPP4-uniprot.untruncated.json), [MSA 완료 원문](../raw/setup/DPP4-msa-check-1.json).\n\n## 바꾼 입력: 분자 B의 SMILES\n\nSMILES는 원자 연결과 입체정보를 문자로 표현한 분자 구조다. 분자마다 `ligand.smiles`를 바꿨고 단백질·MSA·계산 조건은 유지했다. 시타글립틴의 실제 입력은 `N[C@@H](CC(=O)N1CCn2c(nnc2C(F)(F)F)C1)Cc1cc(F)c(F)cc1F`다.\n\n기존 유사체 CHEMBL558585는 중성 모체 CHEMBL517072, CHEMBL537400은 중성 모체 CHEMBL216186의 구조로 계산했다. 염·반대이온을 포함한 전체 구조를 넣지 않았다. 분자별 pH에 따른 양성자화 상태의 비교는 하지 않았다. 실험 IC50, 분자량 감소 목표, ADMET 결과는 이 모델의 입력에 넣지 않았다.\n\n실제 `complex.yaml`에는 버전 1, 단백질 A의 서열·MSA 경로, 분자 B의 SMILES가 들어 있다. `properties`의 `affinity: {binder: B}`는 분자 B에 대한 친화도 계산을 요청한다. 이 프로젝트에서는 JSON 문법으로 저장했으며 유효한 YAML이다. 시각화에 파일 내용과 실행 당시 경로를 그대로 내장했다.\n\n근거: [평가 분자 목록](../data/evaluation-molecules.json), [시타글립틴 제출 원문](../raw/stage06/sitagliptin-binding-submit.json), [실제 입력 YAML](../.local/jobs/21cb2823361f4a05b51cfa608fb3b419/complex.yaml), [YAML·명령 생성 코드](../scripts/model-worker.py).\n\n## 계산 조건\n\n| 항목 | 실제 설정 | 의미 |\n|---|---|---|\n| 모델 / 패키지 | Boltz-2 / boltz 2.2.1 | 로컬 GPU에서 실행 |\n| 장치 | CUDA, RTX 2080 Ti 1개 | CPU 결과로 대체하지 않음 |\n| 난수 seed | 20261016 | 같은 seed로 비교, 여러 seed 반복은 미실행 |\n| Recycling | 3 | 모델 내부 표현의 반복 갱신 |\n| 구조 예측 | 200 steps, 1 sample | 분자별 복합체 구조 CIF 1개 |\n| 친화도 예측 | 200 steps, 5 samples | 친화도 계산의 내부 샘플 수 |\n| MSA | 최대 256, subsample_msa | 공통 MSA에서 서브샘플링 |\n| 실행 옵션 | max_parallel_samples 1, no_kernels | 동시 샘플 수 제한, 선택적 가속 커널 미사용 |\n\n친화도 5 samples는 후보 분자 5개 또는 독립 실험 5회를 의미하지 않는다. 이 실행에서 생성 후보 수와 모델 내부 샘플 수는 다른 개념이다.\n\n근거: [공통 설정 및 9개 결과](../data/binding-evaluation.json), [시타글립틴 완료 원문](../raw/stage06/sitagliptin-binding-final.json), [실행 로그](../raw/stage06/sitagliptin-worker.log).\n\n## 출력과 읽는 방법\n\n| 출력 | 무엇을 나타내는가 | 해석 |\n|---|---|---|\n| complex_model_0.cif | 단백질 A와 분자 B의 예측 3차원 배치 | 실험으로 확정한 결합 구조가 아님 |\n| affinity_pred_value | log10(IC50 / μM) 척도의 친화도 예측 | 낮을수록 강한 결합 예측; 에너지나 일반적 도킹 점수가 아님 |\n| affinity_probability_binary | 결합자 여부 분류의 0–1 출력 | 높을수록 결합자 쪽; 임상 효과 확률이 아님 |\n| confidence_score | 예측 복합체 구조의 종합 신뢰도, 0–1 | 높은 값이 강한 결합을 뜻하지 않음 |\n| ligand_iptm | 단백질–분자 접촉면의 구조 신뢰도 | 결합 세기와 별개 |\n| complex_plddt | 복합체 국소 구조 신뢰도의 평균 | 이 JSON에서는 0–1 척도 |\n\n공식 문서의 종합 구조 점수는 이 복합체에서 `0.8 × complex_plddt + 0.2 × iptm`이다. 친화도 JSON의 1·2 접미사 필드는 앙상블의 두 모델 출력을 구분한다. 서로 다른 약물이나 5개 샘플 전체의 개별 측정값이 아니다.\n\n친화도와 결합 여부는 학습 목적이 다른 출력이다. 공식 문서는 결합 여부 출력을 결합자와 비결합자를 구별하는 데, 친화도 수치를 활성이 있는 분자 사이의 비교에 사용하도록 설명한다. 생성 후보의 실제 활성은 확인되지 않았으므로 수치만으로 활성 분자라고 판정할 수 없다.\n\n근거: [실행 당시 저장한 공식 문서](../raw/setup/boltz-prediction-documentation.json), [Boltz 공식 입력·출력 문서](https://github.com/jwohlwend/boltz/blob/main/docs/prediction.md).\n\n## 시타글립틴의 실제 예\n\n친화도 출력은 1.182450056이며 `10^1.182450056 = 15.221240783 μM`로 환산된다. 이는 모델의 IC50 척도 환산값이며 실험 IC50가 아니다. 비교에 사용한 실험 IC50는 CHEMBL829504의 18 nM, 즉 0.018 μM다. 값의 차이가 크므로 이 설정을 해당 실험에 대해 보정된 예측 도구라고 볼 수 없다.\n\n결합 여부 점수는 0.189794838, 구조 신뢰도는 0.942058504다. 구조 신뢰도가 높아도 결합 관련 값이 실험을 잘 재현한다는 보장은 없다는 실제 예다. 접촉면 신뢰도는 0.845595658, 전체 평균 pLDDT는 0.966174185다.\n\n원약보다 친화도 출력이 높지 않고 결합 여부 점수가 낮지 않은 경우를 두 결합 지표의 상대 기준 충족으로 표시했다. 생성 후보 중 M3·M5가 해당하지만, 실제 결합 유지의 증거는 아니다. 분자량 감소와 ADMET까지 함께 본 최종 결론은 기존 종합 보고서를 따른다.\n\n단일 사슬·입력 분자의 양성자화 상태·단일 seed 등은 해석의 한계다. 이 중 어느 항목이 예측과 실험 차이의 원인인지는 이번 실행으로 검증하지 않았다.\n\n근거: [실험값을 포함한 결합 평가](../data/binding-evaluation.json), [구조·로그 파일 해시](../data/evaluation-artifacts.json), [결합·ADMET 종합 보고서](06-07-binding-admet-comparison.md).\n"}],"sources":[{"path":"project.json","sha256":"1d34d151536e3bfe3d4cc6cbb6267ff21002b3d6800bba622df9212c6fcd1a96"},{"path":"scripts/visualization/methods.js","sha256":"e07c3f23335497bf4a7061a6950afd914fd55ef273169c9e0ca0412369ea0408"},{"path":"raw/2026-10-16-feasibility-opentargets-disease.json","sha256":"d3513b66224b00497c3730dde7402225d56971cfefc437c0d280dba8ad716cdb"},{"path":"raw/stage01/01-associated-targets.json","sha256":"e87afebd74c73a9f546fac05171ecf19f1d5af1d0d1dc5453c46d95c1c96f992"},{"path":"raw/2026-10-16-disease-feasibility-web.json","sha256":"3efe951c05a318020e6e7c0c6ac672aedc0323f489188e6d773ac89b6b4735b   const related=t.drugs.entries.filter(x=>x.includes_selected_disease),n=findingNotes[t.symbol];

    +findingLine('이 단백질에 대해 알게 된 점','이 표적과 연결된 기존 약물·개발 후보가 있어 출발 분자와 비교군을 찾을 수 있습니다. 대표 약물의 이름·ChEMBL ID·개발 단계·관련 질환이 반환됐습니다.')
    +findingLine('해석의 한계','염 형태·개발 후보·다른 적응증이 섞인 목록입니다. 전체 건수를 서로 다른 당뇨병 승인약 수로 세거나, 이 조회만으로 약물의 결합력·임상적 우열을 판단하지 않습니다.')

function queryExpression(t){

    +findingLine('이 단백질에 대해 알게 된 점 · 해석',findingNotes[t.symbol].expression)
    +findingLine('해석의 한계','표시한 값은 유전자의 RNA 양입니다. 단백질 양·활성이나 약물 선택성·안전성을 직접 측정한 값이 아닙니다. 정상 상태의 자료이므로 당뇨병 환자에서 증가했다는 뜻도 아닙니다.')
    +`<details><summary>GTEx 상위 8개 기록과 측정 범위</summary><div class="table-wrap"><table><thead><tr><th>원문 조직 이름</th><th>중앙값 · TPM</th></tr></thead><tbody>${t.expression.gtex_top_tissues.map(x=>`<tr><td>${esc(x.tissue)}<br><span class="note">${esc(tissueKorean[x.tissue]||'')}</span></td><td>${x.median}</td></tr>`).join('')}</tbody></table></div><p>TPM은 백만 전사체당 환산한 RNA 발현 단위입니다. 전체 응답에는 RNA·단백질 측정법과 단위가 다른 자료가 포함되어, 같은 GTEx·TPM 기록만 비교했습니다. ${t.expression.gtex_rows}개는 기록 수이며 고유 조직 수가 아닙니다.</p>${source(`raw/stage02/${t.symbol}-expression.full.json.provenance.json`,'전체 응답 회수·해시 기록')}</details>`;
}
function querySafety(t){
  if(t.safety.entries===null)return findingLine('실제 결과','<strong>안전성 필드가 반환되지 않았습니다.</strong><p>응답의 target에는 유전자 ID와 기호만 있고 <code>safetyLiabilities</code> 항목이 없습니다.</p>')
    +findingLine('이 단백질에 대해 알게 된 점','이 조회만으로는 표적 조절의 안전성 관련 내용을 확보하지 못했습니다. 결과를 미확인으로 남깁니다.')
    +findingLine('해석의 한계','부작용 0건이나 안전성 입증이 아닙니다. 기존 약물의 규제 문서상 경고는 별도 근거이며, 이 도구에서 반환된 것으로 설명하지 않습니다.');
  return findingLine('실제 결과',`<strong>${t.safety.entries.length}개 주석 반환 · 근거 유형이 서로 다름</strong><p>전임상으로 표시된 활성화/증가 방향의 주석에 심부전, 체중 증가, 혈장량·수분 저류 증가 등이 있습니다. 혈당 감소 같은 생리 변화도 포함됩니다.</p>`)
    +findingLine('이 단백질에 대해 알게 된 점','PPARγ 조절 시 살펴볼 생리적 영향과 안전성 관련 기록이 있습니다. 작용을 높이는지 낮추는지, 어떤 실험·약물에서 나온 주석인지 함께 검토해야 합니다.')
    +findingLine('해석의 한계','20개를 부작용 20종으로 세지 않습니다. ToxCast의 활성 측정, AOP-Wiki의 기전 주석, 아스피린·올란자핀 관련 유전 기록도 섞여 있습니다. 모두 피오글리타존의 임상 부작용이거나 발생 확률을 뜻하지 않습니다.')
    +`<details><summary>전체 ${t.safety.entries.length}개 주석 · 출처·연구 유형·방향</summary><div class="table-wrap"><table class="safety-record-table"><thead><tr><th>기록 내용</th><th>출처 · 연구 유형</th><th>표적 조절 방향</th></tr></thead><tbody>${t.safety.entries.map(x=>`<tr><td>${esc(safetyKorean[x.event]||x.event)}<br><span class="note">${esc(x.event)}</span></td><td>${esc(x.datasource)}<br>${[...new Set((x.studies||[]).map(s=>studyKorean[s.type]||s.type))].map(esc).join(' · ')}${x.literature?`<br><a href="https://pubmed.ncbi.nlm.nih.gov/${esc(x.literature)}/" target="_blank" rel="noopener">PMID ${esc(x.literature)}</a>`:''}</td><td>${(x.effects||[]).map(e=>e.direction==='Activation/Increase/Upregulation'?'활성화 / 증가':e.direction==='Inhibition/Decrease/Downregulation'?'억제 / 감소':esc(e.direction)).join(' · ')||'미기재'}</td></tr>`).join('')}</tbody></table></div><p>ClinPGx의 아스피린 과민반응과 올란자핀 유발 체중 증가는 해당 약물·유전적 맥락의 기록입니다. 안전성 필드가 비어 있는 다른 두 표적과 건수로 위험 순위를 매기지 않습니다.</p></details>`;
}

}
function targetQueries(){return `<section class="target-queries" aria-labelledby="target-queries-title"><div class="panel target-definition"><div class="eyebrow">FOUR QUESTIONS / THREE TARGETS</div><h2 id="target-queries-title">네 조회로, 세 단백질의 무엇을 알아봤나요?</h2><p>질환과의 유전학적 연결, 기존 약물, 발현되는 조직, 조절 시 검토할 영향을 조사했습니다. 아래 비교표와 후보별 상세에서 <strong>반환된 사실 → 그 의미 → 해석의 한계</strong>를 연결해 읽을 수 있습니다.</p><p class="note">유전학 조회만 제2형 당뇨병 ID를 입력했습니다. 나머지 조회는 유전자 ID만 입력하므로 다른 질환·정상 조직·다른 약물의 맥락도 포함됩니다. ‘완료’는 응답 수신 상태입니다.</p></div><div class="table-wrap query-overview"><table><caption>저장된 조회 결과로 비교한 세 단백질</caption><thead><tr><th>확인한 내용</th>${D.targets.candidates.map(t=>`<th>${t.symbol}<br><span class="note">${targetGuide[t.symbol].protein}</span></th>`).join('')}</tr></thead><tbody><tr><th>유전학적 연결</th>${D.targets.candidates.map(t=>`<td>${t.genetic_evidence.count?`${t.genetic_evidence.count}개 중 ${t.genetic_evidence.returned}개 수신<br>유전학적 근거 확보`:'0건<br>이 조건에서 미확인'}</td>`).join('')}</tr><tr><th>기존 약물 기록</th>${D.targets.candidates.map(t=>`<td>${t.drugs.count}개 · 당뇨병 ID 포함 ${t.drugs.entries.filter(x=>x.includes_selected_disease).length}개<br><span class="note">${findingNotes[t.symbol].drugText}</span></td>`).join('')}</tr><tr><th>높은 RNA 발현 예시</th>${D.targets.candidates.map(t=>`<td>${t.expression.gtex_top_tissues.slice(0,2).map(x=>`${esc(tissueKorean[x.tissue]||x.tissue)} ${fmt(x.median,2)} TPM`).join('<br>')}</td>`).join('')}</tr><tr><th>안전성 관련 주석</th>${D.targets.candidates.map(t=>`<td>${t.safety.entries?`${t.safety.entries.length}개 주석<br>전임상·세포·임상 맥락 구분`:'필드 미반환<br>안전성 미확인'}</td>`).join('')}</tr></tbody></table></div><p class="table-note">건수는 조회 기록 수입니다. 승인약 수·독립 연구 수·위험 점수로 비교하지 않습니다.</p><div class="section-heading"><h2>단백질별로 결과 자세히 읽기</h2>${reportButton(4,'해설 보고서 읽기')}</div><div class="segmented target-query-selector" role="group" aria-label="조회 내용을 읽을 표적">${D.targets.candidates.map(t=>`<button class="button ${state.evidenceTarget===t.symbol?'active':''}" data-evidence-target="${t.symbol}" aria-pressed="${state.evidenceTarget===t.symbol}" aria-controls="target-query-detail">${t.symbol} · ${targetGuide[t.symbol].protein}</button>`).join('')}</div><div id="target-query-detail">${targetQueryDetail()}</div>${callout('DPP4를 선택한 이유','네 조회에서는 여러 기존 약물을 확보한 점이 강점입니다. 최종 선택에는 별도로 확인한 실험 구조·유사체 자료와 입문 실습의 진행 가능성도 반영했습니다. 유전학적 기록 수나 안전성 주석 수만으로 선택한 것은 아닙니다.')}<p class="note">아래 도구 기록은 이 결과를 얻은 실행 경로입니다. 기존 약물의 규제 문서 검토는 ${reportButton(0,'기존 타깃 비교 보고서')}에서 별도로 확인할 수 있습니다.</p></section>`;}

    <div class="recheck-details">${q.rows.map(r=>`<details class="panel recheck-drug" data-recheck-drug="${r.name}"><summary>${r.name_ko} · 구조 식별자·기전·새 원문 보기</summary><div class="recheck-identity"><span class="label">세 DB에서 대조한 입체 구조 식별자</span><code>${esc(r.chembl.inchikey)}</code><p class="note">InChIKey는 분자 구조를 식별하는 코드입니다. ${r.identity_check.matches_original_structure?'기존 연구에 사용한 구조와도 일치합니다.':'기존 구조와의 일치 여부를 추가 확인해야 합니다.'} SMILES는 표현 순서가 달라질 수 있어 문자열만 비교하지 않았습니다.</p></div><div class="grid two"><div><h4>ChEMBL에서 확인한 내용</h4><p>구조와 기전 조회 성공. 기전 ${r.chembl.mechanism_record_count}개 기록이 DPP4 · CHEMBL284, INHIBITOR, 직접 작용으로 연결됩니다.</p>${sources([[r.sources.molecule,'구조 재조회 원문'],[r.sources.mechanism,'기전 재조회 원문']])}<p class="note">${r.chembl.mechanisms.some(m=>m.molecule_chembl_id!==m.parent_molecule_chembl_id)?'염 형태에 기록된 기전을 모체 약물 ID로 연결했습니다.':'약물 ID와 모체 ID가 같은 기전 기록입니다.'}</p></div><div><h4>다른 DB에서 확인한 내용</h4><p>PubChem CID ${r.pubchem.cid}, GtoPdb ligand ${r.gtopdb.ligand_id}. GtoPdb의 ChEMBL·PubChem 연결 ID와 구조 식별자를 대조했습니다. 사람 DPP4 · P27487의 Inhibitor / Inhibition 기록을 받았습니다.</p>${sources([[r.sources.pubchem_properties,'PubChem 구조 원문'],[r.sources.gtopdb_search,'GtoPdb 구조 원문'],[r.sources.gtopdb_interactions,'GtoPdb 작용 원문']])}</div></div><p class="recheck-affinity"><strong>별도 활성 기록:</strong> ${r.gtopdb.human_dpp4_interactions.map(x=>`${esc(x.affinityUnits)} ${fmt(Number(x.affinityMedian),2)}`).join(' · ')}. ${r.name==='linagliptin'?'pKi는 Ki를 로그로 표현한 값입니다.':'pIC50는 IC50를 로그로 표현한 값입니다.'} 기존 동일 실험의 IC50 비교값으로 바꾸어 넣지 않았습니다.</p></details>`).join('')}</div>
    <div class="callout"><strong>이번 재조회에서 확인한 범위</strong><p>세 약물의 구조와 DPP4 억제 기전을 확인했습니다. GtoPdb의 pIC50·pKi는 지표와 실험 조건이 달라 아래의 기존 동일 실험 비교와 구분합니다. 기존 시타글립틴 선택과 모델 입력 구조는 유지됩니다.</p></div><details class="recheck-access"><summary>자료 접근 경로와 확인 한계</summary><p class="note">GtoPdb 데이터는 도구가 반환한 공식 ligands.csv·interactions.csv 기록에서 확인했습니다. 웹 상세 페이지는 로그인 화면으로 전환되어 본문을 확인하지 못했습니다. 과거 ChEMBL 오류의 복구 원인도 단정하지 않습니다.</p>${sources([['raw/stage03-recheck-2026-10-17/gtopdb-web-pages.json','웹 접근 확인 기록'],['data/stage3-recheck.json','정리 결과·원문 해시']])}</details>

    ${r.parent_chembl_id?`<p class="note boltz-parent">실험 기록 ID <b>${esc(r.id)}</b>에 연결된 중성 모체 <b>${esc(r.parent_chembl_id)}</b>의 구조를 넣었습니다. 염·반대이온을 포함한 전체 구조를 넣은 것이 아닙니다.</p>`:''}
    <p class="note boltz-parent">분자마다 같은 단백질·MSA·설정을 사용했습니다. 실험 IC50와 ADMET 결과는 Boltz-2 입력에 넣지 않았습니다.</p></div>

2Mol 원문'],['raw/model-checks/libinvent-check-1.json','추출 전 실패'],['raw/model-checks/libinvent-final.json','LibInvent 원문'],['data/generation-design.json','생성 설계']])}</details>${reportButton(2)}`;}

}

function cellColor(k,v){if(v===null||!Number.isFinite(v))return '';if(state.heatMode==='absolute')return `rgba(91,133,158,${Math.min(.62,.08+Math.abs(v)/(k==='Solubility_AqSolDB'?5:Math.abs(v)>1?80:1)*.5)})`;const direction=harmful.has(k)?1:favorable.has(k)?-1:0;if(!direction)return '#eff1ed';const max=k==='Solubility_AqSolDB'?1:.5,alpha=Math.min(.7,.04+Math.abs(v)/max*.6);return v*direction>0?`rgba(219,139,79,${alpha})`:`rgba(70,153,137,${alpha})`;}
function heatmap(){const keys=groups[state.heatGroup].keys;return `<div class="table-wrap"><table class="heatmap"><thead><tr><th>분자</th>${keys.map(k=>`<th>${epName(k)}<br><span class="mono">${esc(D.endpoints.find(e=>e.id===k)?.units==='-'?'0–1':D.endpoints.find(e=>e.id===k)?.units)}</span></th>`).join('')}</tr></thead><tbody>${filteredRows().map(r=>`<tr><td><button class="result-name row-name" data-select="${r.id}">${esc(name(r.id))}</button></td>${keys.map(k=>{const v=state.heatMode==='delta'?r.a.deltas[k]:r.a.usable[k],bad=r.a.quality_flags.some(q=>q.endpoint===k),missing=v===null;return `<td><button class="heatcell ${missing?'invalid':''}" style="${missing?'':'background:'+cellColor(k,v)}" data-cell="${r.id}|${k}" aria-label="${esc(name(r.id)+' '+epName(k)+' '+(missing?(bad?'범위 밖 값, 평가 제외':'비교 불가'):fmt(v)))}" title="${esc(k)}">${missing?(bad?'범위 밖':'비교 불가'):(state.heatMode==='delta'?signed(v):fmt(v))}</button></td>`;}).join('')}</tr>`).join('')||`<tr><td colspan="${keys.length+1}" class="empty">검색 조건에 맞는 분자가 없습니다.</td></tr>`}</tbody></table></div>`;}
function heatPanel(){return `<div class="section-heading"><h2>ADMET 변화 지도</h2>${pill('모델 예측','purple')}</div><div class="toolbar"><div class="segmented" aria-label="ADMET 범주">${Object.entries(groups).map(([k,g])=>`<button class="button small ${state.heatGroup===k?'active':''}" data-group="${k}" aria-pressed="${state.heatGroup===k}">${g.name}</button>`).join('')}</div><label class="control">표시<select id="heat-mode"><option value="delta" ${state.heatMode==='delta'?'selected':''}>원약 대비 변화 Δ</option><option value="absolute" ${state.heatMode==='absolute'?'selected':''}>예측값</option></select></label></div><div id="heatmap">${heatmap()}</div><div class="heat-insight" id="heat-insight" role="status">셀을 누르면 정확한 값·단위·원약 대비 변화와 평가 제외 이유를 볼 수 있습니다.</div><div class="legend"><span><i style="background:#dfa46d"></i>주황: 주의 방향의 변화</span><span><i style="background:#82b9ab"></i>청록: 반대 방향의 변화</span><span><i style="background:#bec5bd"></i>회색: 유불리 방향을 지정하지 않음</span></div><p class="table-note">Δ 모드의 색은 지표별 변화 방향을 표시합니다. 서로 다른 단위의 크기를 직접 비교할 수 없습니다. 예측값 모드는 파란 농도로 값만 표시합니다. BBB 변화는 전체 오프타깃 감소를 뜻하지 않으며, 분포·배설 지표에는 보편적인 유불리 방향을 부여하지 않았습니다.</p>`;}
function criteria(){const lower=candidates.filter(r=>r.b.delta_mw<0),both=lower.filter(r=>r.b.relative_binding_screen),all=both.filter(r=>!r.a.heuristic_watch_flags.length);return `<div class="section-heading"><h2>목표를 한 조건씩 확인하면</h2><span class="note">출발 약물·유사체 제외, 생성 후보 6개 기준</span></div><div class="criteria-grid"><div class="panel"><span class="eyebrow">01 / MOLECULAR WEIGHT</span><h3>분자량 감소</h3><strong class="count">${lower.length} <small class="note">/ 6개</small></strong><p class="note">${lower.map(r=>r.id).join(' · ')}<br>시타글립틴보다 계산 MW가 작음</p></div><div class="panel"><span class="eyebrow">02 / BINDING</span><h3>+ 두 결합 지표 상대 유지</h3><strong class="count">${both.length} <small class="note">/ ${lower.length}개</small></strong><p class="note">${both.map(r=>r.id).join(' · ')||'없음'}<br>친화도 출력 ≤ 원약, 결합 분류 점수 ≥ 원약</p></div><div class="panel"><span class="eyebrow">03 / ADMET</span><h3>+ ADMET 주의 기준 미해당</h3><strong class="count">${all.length} <small class="note">/ ${both.length}개</small></strong><p class="note">M3: hERG·DILI·CYP 억제 점수와 용해도에서 불리한 변화</p></div></div>`;}
function stageSeven(){return `<div class="panel"><div class="row spaced"><h2>9개 분자, 같은 ADMET 모델</h2>${pill('9 / 9 완료')}</div><p class="note" style="margin-top:10px">ADMET-AI 2.0.1로 원약·기존 유사체·생성 후보를 평가했습니다. 분류 출력은 모델 점수이며, 환자에게 부작용이 생길 임상 확률이나 안전성 등급이 아닙니다.</p></div>${criteria()}${heatPanel()}${callout('물리 범위를 벗어난 예측값 19개는 평가에서 제외했습니다.','음수 분포 용적·청소율·반감기 등은 원값을 보존하고 평가용 값을 null로 처리했습니다. 0으로 바꾸거나 누락된 값을 유리한 결과로 취급하지 않았습니다.')}<div class="grid two"><div class="panel"><h3>주의 표시는 탐색용 기준입니다.</h3><p class="note" style="margin-top:10px">지정한 독성·CYP 억제 점수 증가 &gt; 0.1, 용해도 감소 &gt; 0.5 log(mol/L), 경구 생체이용률·장 흡수 점수 감소 &gt; 0.1을 표시했습니다. 검증된 임상적 경계값이 아닙니다.</p>${sources([['data/evaluation-criteria.json','선별 기준'],['data/admet-endpoints.json','지표 정의']])}</div><div class="panel"><h3>이번 연구의 결론</h3><p class="note" style="margin-top:10px">모든 조건을 함께 만족한 생성 후보는 없습니다. M3의 MW 감소는 0.95 g/mol에 그쳤고, 결합 양성 대조군의 보정 한계도 남았습니다. 후속 후보의 선택이나 실험적 개선 판정은 이루어지지 않았습니다.</p>${reportButton(3,'최종 보고서 읽기')}</div></div>`;}
function table(){let list=filteredRows();if(state.sort!=='order')list=[...list].sort((a,b)=>{let av=state.sort==='flags'?a.a.heuristic_watch_flags.length:a.b[state.sort],bv=state.sort==='flags'?b.a.heuristic_watch_flags.length:b.b[state.sort];return (av-bv)*(state.ascending?1:-1);});const columns=[['molecular_weight','MW · g/mol'],['delta_mw','Δ MW'],['affinity_pred_value','친화도 ↓'],['affinity_probability_binary','결합 점수 ↑'],['confidence_score','구조 신뢰도'],['flags','ADMET 주의']];return `<div class="table-wrap"><table class="results-table"><thead><tr><th>분자</th><th>출처</th>${columns.map(([k,label])=>`<th class="number"><button class="sort" data-sort="${k}" aria-pressed="${state.sort===k}">${label} ${state.sort===k?(state.ascending?'↑':'↓'):'↕'}</button></th>`).join('')}<th class="number">실험 IC50 · nM</th></tr></thead><tbody>${list.map(r=>`<tr class="${r.id===state.selected?'highlight':''}"><td><button class="result-name" data-select="${r.id}">${esc(name(r.id))}</button></td><td class="note nowrap">${labels[role(r)]}</td><td class="number">${fmt(r.molecular_weight,2)}</td><td class="number">${signed(r.b.delta_mw,2)}</td><td class="number">${fmt(r.b.affinity_pred_value)}</td><td class="number">${fmt(r.b.affinity_probability_binary)}</td><td class="number">${fmt(r.b.confidence_score)}</td><td class="number ${r.a.heuristic_watch_flags.length?'watch':''}">${r.a.heuristic_watch_flags.length}</td><td class="number">${fmt(r.b.measured_IC50_nM,0)}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">검색 조건에 맞는 분자가 없습니다.</td></tr>'}</tbody></table></div>`;}
function compare(){return `<div class="page-title"><div class="eyebrow">MOLECULE EXPLORER</div><h1>같은 기준으로, 직접 비교하기</h1><p>그래프·표·ADMET 셀을 선택하면 해당 분자의 구조와 상세 결과가 연결됩니다.</p></div><div class="toolbar"><div class="segmented">${[['all','전체 9개'],['generated','생성 후보 6개'],['lighter','가벼워진 후보 4개']].map(([v,t])=>`<button class="button ${state.filter===v?'active':''}" data-filter="${v}" aria-pressed="${state.filter===v}">${t}</button>`).join('')}</div><div class="row"><input id="molecule-search" type="search" placeholder="분자 이름·ID·SMILES 검색" aria-label="분자 검색" value="${esc(state.query)}"><button class="button small" id="download-csv">현재 표 CSV ↓</button></div></div><div class="explorer-layout"><div>${chartPanel()}<p class="note" id="visible-count" style="margin-top:8px">${filteredRows().length} / 9개 표시</p></div><aside class="panel detail-card" id="molecule-detail" aria-label="선택한 분자 상세">${detail()}</aside></div><div class="section-heading"><h2>전체 지표 비교</h2><span class="note">열 제목을 눌러 정렬할 수 있습니다.</span></div><div id="results-table">${table()}</div><p class="table-note">친화도: log10(IC50 / μM), 낮을수록 강한 결합 예측. 실험 IC50는 별도 열에 표시하며 생성 후보의 실험값은 없습니다. ADMET 주의 개수는 종합 안전성 점수가 아닙니다.</p>${heatPanel()}${calibration()}`;}
function sourcesPage(){return `<div class="page-title"><div class="eyebrow">EVIDENCE & REPRODUCIBILITY</div><h1>결과에서 근거로 돌아가기</h1><p>이 HTML은 저장된 연구 결과의 스냅샷입니다. 화면 조작으로 모델을 다시 실행하거나 연구 결정을 바꾸지 않습니다.</p></div><div class="grid two"><div class="panel"><h3>읽기용 보고서</h3><p class="note" style="margin-top:8px">원래 작성 시점의 서술을 보존했습니다. 초기 보고서의 ‘선택 전’ 문구와 현재의 확정 상태를 구분하세요.</p><div class="stack" style="margin-top:16px">${D.reports.map((r,i)=>`<div class="row spaced"><span>${esc(r.title)}</span>${reportButton(i,'이 화면에서 읽기')}</div>`).join('')}</div></div><div class="panel"><h3>검증된 실행 범위</h3>${keyValue('요청 단계','7단계까지 완료')}${keyValue('실제 생성','10회 · 고유 후보 6개')}${keyValue('결합 / ADMET','9 / 9개 각각 완료')}${keyValue('평가 제외 ADMET 값','19개 · 원값 보존')}${keyValue('후속 후보 선택','없음')}${keyValue('기존 물질·특허 단계','미실행')}</div></div><div class="section-heading"><h2>실패·대체 경로도 기록했습니다.</h2>${pill('실행 이력','gray')}</div><div class="panel"><div class="source-item"><h3>ChEMBL 조회</h3><p class="note">기본 REST 경로 실패 후 공식 ChEMBL 37 검색 인덱스를 사용했습니다. 전체 유사도 검색 실패 후 최초 논문 안에서 비교군을 확보해 검색 범위를 명시했습니다.</p></div><div class="source-item"><h3>생성 모델</h3><p class="note">LibInvent 입력 어휘 실패는 샘플링 전 발생했습니다. 실제 추출은 두 모델 합계 10회입니다. 고정 골격의 R 입체중심 복원과 Mol2Mol 내부 해시 경고를 별도로 보존했습니다.</p></div><div class="source-item"><h3>결합·ADMET 실행</h3><p class="note">Boltz-2는 프로젝트 안의 환경에서 실제 실행했습니다. 기본 ADMET MCP 도구는 응답을 받지 못했고, 검증된 로컬 ADMET-AI 연결에서 최종 9개를 계산했습니다. 미완료 호출을 성공으로 계산하지 않았습니다.</p></div>${sources([['docs/SETUP.md','환경·실패·실행 근거'],['data/evaluation-validation.json','검증 기록'],['data/evaluation-artifacts.json','구조·로그 해시']])}</div><div class="section-heading"><h2>스냅샷 원본 파일</h2><button class="button small" id="download-manifest">출처·해시 저장 ↓</button></div><p class="note">각 링크는 프로젝트의 원본 파일을 엽니다. HTML만 다른 위치로 옮겨도 시각화와 내장 보고서는 동작하지만, 이 상대 경로 링크는 프로젝트 폴더가 있어야 열립니다. 아래 SHA-256은 이 HTML에 반영한 파일의 내용 지문입니다.</p><div class="panel" style="margin-top:15px">${D.sources.map(s=>`<div class="source-item"><div class="row spaced">${source(s.path,s.path)}<span class="label">SHA-256</span></div><code>${s.sha256}</code></div>`).join('')}</div>`;}
function render(scroll=false){
  const valid=['overview','compare','methods','sources',...stages.map((_,i)=>'stage-'+(i+1))];state.page=valid.includes(location.hash.slice(1))?location.hash.slice(1):'overview';
  if(state.page!=='compare'){state.filter='all';state.query='';}
  if(state.page==='stage-6')state.selected=state.boltzId;
  let content;if(state.page==='overview')content=overview();else if(state.page==='compare')content=compare();else if(state.page==='methods')content=methodsPage();else if(state.page==='sources')content=sourcesPage();else{const n=Number(state.page.split('-')[1]);const stageBody=[stageOne,stageTwo,stageThree,stageFour,stageFive,stageSix,stageSeven][n-1]();content=stageHeading(n)+((n===2||n===3||n===6)?stageBody+methodPanel(n):methodPanel(n)+stageBody)+stageControls(n);}
  $('#main').innerHTML=content;
  document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===state.page;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const title=state.page==='overview'?'전체 흐름':state.page==='compare'?'후보 비교':state.page==='methods'?'스킬·도구 지도':state.page==='sources'?'데이터·근거':stages[Number(state.page.split('-')[1])-1][0];
  $('#breadcrumb').textContent='연구 노트 / '+title;document.title=title+' · DPP4 Research Journey';
  if(scroll){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}
}
function updatePlots(){const visible=filteredRows();if(visible.length&&!visible.some(r=>r.id===state.selected))state.selected=visible[0].id;if($('#scatter'))$('#scatter').innerHTML=scatter();if($('#molecule-detail'))$('#molecule-detail').innerHTML=detail();if($('#results-table'))$('#results-table').innerHTML=table();if($('#heatmap'))$('#heatmap').innerHTML=heatmap();if($('#visible-count'))$('#visible-count').textContent=filteredRows().length+' / 9개 표시';}
function select(id){if(!rows.some(r=>r.id===id))return;state.selected=id;if(state.page==='stage-6'){state.boltzId=id;$('#boltz-ligand').value=id;$('#boltz-run-detail').innerHTML=boltzInputDetail();}updatePlots();}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),2500);}
function download(filename,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function markdown(md){
  function inline(s){return esc(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>/^(https?:\/\/|\.\.\/|[a-zA-Z0-9])/.test(url)?`<a href="${url}" target="_blank" rel="noopener">${label}</a>`:label).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}
  let html='',tableOpen=false;
  for(const line of md.split('\n')){if(line.trim().startsWith('|')){if(/^\|[\s:|\-]+\|\s*$/.test(line))continue;if(!tableOpen){html+='<div class="table-wrap"><table>';tableOpen=true;}html+='<tr>'+line.trim().slice(1,-1).split('|').map(s=>'<td>'+inline(s.trim())+'</td>').join('')+'</tr>';continue;}if(tableOpen){html+='</table></div>';tableOpen=false;}const h=line.match(/^(#{1,3})\s+(.*)/);if(h)html+=`<h${Math.min(3,h[1].length+1)}>${inline(h[2])}</h${Math.min(3,h[1].length+1)}>`;else if(line.trim())html+='<p>'+inline(line.replace(/^[-*] /,'• '))+'</p>';}
  return html+(tableOpen?'</table></div>':'');
}
document.addEventListener('click',async event=>{
  const el=event.target.closest('button,a,[data-select]');if(!el)return;
  if(el.dataset.evidenceTarget){state.evidenceTarget=el.dataset.evidenceTarget;document.querySelectorAll('[data-evidence-target]').forEach(b=>{const active=b.dataset.evidenceTarget===state.evidenceTarget;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active);});$('#target-query-detail').innerHTML=targetQueryDetail();}
  if(el.dataset.page)location.hash=el.dataset.page;
  if(el.dataset.molecule){state.selected=el.dataset.molecule;if(location.hash==='#compare')updatePlots();else location.hash='compare';}
  if(el.dataset.select)select(el.dataset.select);
  if(el.dataset.filter){state.filter=el.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===state.filter);b.setAttribute('aria-pressed',b.dataset.filter===state.filter);});updatePlots();}
  if(el.dataset.group){state.heatGroup=el.dataset.group;document.querySelectorAll('[data-group]').forEach(b=>{b.classList.toggle('active',b.dataset.group===state.heatGroup);b.setAttribute('aria-pressed',b.dataset.group===state.heatGroup);});$('#heatmap').innerHTML=heatmap();$('#heat-insight').textContent='셀을 눌러 자세한 값과 단위를 확인하세요.';}
  if(el.dataset.cell){const [id,k]=el.dataset.cell.split('|'),r=rows.find(x=>x.id===id),ep=D.endpoints.find(e=>e.id===k),q=r.a.quality_flags.find(x=>x.endpoint===k);select(id);$('#heat-insight').textContent=`${name(id)} · ${epName(k)} (${ep?.units==='-'?'0–1 모델 점수':ep?.units}) | 원출력 ${fmt(r.a.raw[k],5)} · 평가용 ${fmt(r.a.usable[k],5)} · 원약 대비 Δ ${signed(r.a.deltas[k],5)}${q?' | 문서상 물리 범위를 벗어나 평가 제외':r.a.deltas[k]===null?' | 원약 또는 후보 평가값 결측으로 Δ 계산 불가':''}`;}
  if(el.dataset.sort){state.ascending=state.sort===el.dataset.sort?!state.ascending:true;state.sort=el.dataset.sort;$('#results-table').innerHTML=table();}
  if(el.dataset.report!==undefined){const r=D.reports[Number(el.dataset.report)];$('#report-title').textContent=r.title;$('#report-content').innerHTML=markdown(r.text);$('#report-dialog').showModal();}
  if(el.id==='close-report')$('#report-dialog').close();
  if(el.id==='print')window.print();
  if(el.id==='toggle-methods'){const all=[...document.querySelectorAll('.method-details')],open=all.some(d=>!d.open);all.forEach(d=>d.open=open);el.textContent=open?'모든 단계 접기':'모든 단계 펼치기';}
  if(el.id==='download-data')download('DPP4-research-snapshot.json',JSON.stringify(D,null,2),'application/json;charset=utf-8');
  if(el.id==='download-manifest')download('DPP4-source-manifest.json',JSON.stringify(D.sources,null,2),'application/json;charset=utf-8');
  if(el.id==='download-boltz-input')download(boltzRun().id+'-complex.yaml',boltzRun().input_text,'application/yaml;charset=utf-8');
  if(el.id==='download-boltz-output'){const r=boltzRun();download(r.id+'-boltz-outputs.json',JSON.stringify({id:r.id,job_id:r.job_id,source:r.paths.final,affinity:r.affinity,confidence:r.confidence},null,2),'application/json;charset=utf-8');}
  if(el.id==='download-csv'){const keys=['id','role','model','molecular_weight','delta_mw','affinity_pred_value','affinity_probability_binary','confidence_score','measured_IC50_nM','measured_assay','admet_watch_count','admet_invalid_count','binding_source','admet_source'];const csv=[keys,...Array.from(document.querySelectorAll(".results-table tbody .result-name")).map(el=>rows.find(r=>r.id===el.dataset.select)).map(r=>{const flat={...r.b,model:r.model||'',admet_watch_count:r.a.heuristic_watch_flags.length,admet_invalid_count:r.a.quality_flags.length,admet_source:r.a.source};return keys.map(k=>flat[k]??'');})].map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');download('DPP4-filtered-comparison.csv','\uFEFF'+csv,'text/csv;charset=utf-8');}
  if(el.dataset.copy){const text=rows.find(r=>r.id===el.dataset.copy).smiles;try{await navigator.clipboard.writeText(text);toast('SMILES를 복사했습니다.');}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.top='-9999px';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'SMILES를 복사했습니다.':'아래 SMILES를 직접 선택해 복사해 주세요.');}}
});
document.addEventListener('change',e=>{if(e.target.id==='boltz-ligand')select(e.target.value);if(e.target.id==='metric'){state.metric=e.target.value;const panel=e.target.closest('.chart-panel');panel.querySelector('p.note').textContent=metricOptions[state.metric].title;$('#scatter').innerHTML=scatter();}if(e.target.id==='heat-mode'){state.heatMode=e.target.value;$('#heatmap').innerHTML=heatmap();$('#heat-insight').textContent=state.heatMode==='delta'?'Δ는 시타글립틴 대비 변화입니다.':'모델 예측값입니다. 임상 확률이나 안전성 등급이 아닙니다.';}});
document.addEventListener('input',e=>{if(e.target.id==='molecule-search'){state.query=e.target.value;updatePlots();}});
document.addEventListener('keydown',e=>{if(e.target.matches('.chart-dot')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(e.target.dataset.select);}});
window.addEventListener('hashchange',()=>render(true));
navigation();render();
</script>
</body>
</html>
